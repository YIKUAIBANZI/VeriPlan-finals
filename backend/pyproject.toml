[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "veriplan-backend"
version = "0.1.0"
description = "Traceable decision workflow backend for VeriPlan"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=1,<2",
  "fastapi>=0.115,<1",
  "httpx2>=2.12,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
