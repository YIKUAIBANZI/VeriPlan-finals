server {
    listen 80;
    server_name veriplan.yikuaibanz.cn;

    # Live mode spends real API credits: keep the whole site behind basic auth.
    auth_basic "VeriPlan";
    auth_basic_user_file /etc/nginx/veriplan.htpasswd;

    root /opt/veriplan/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:9195;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri /index.html;
    }
}
